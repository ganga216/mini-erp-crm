version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mini_erp_db
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: mini_erp_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d mini_erp_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_erp_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://erp_user:erp_password@postgres:5432/mini_erp_crm?schema=public"
      JWT_SECRET: "mini-erp-secret-key-2026-production"
      PORT: "5000"
      FRONTEND_URL: "http://localhost:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mini_erp_frontend
    ports:
      - "8080:80"
    environment:
      VITE_API_URL: "http://localhost:5000/api"
    depends_on:
      - backend

volumes:
  postgres_data:
